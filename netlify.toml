[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  # lambda-local default is 30s — bump for AI functions
  timeout = 120

[functions]
  node_bundler = "esbuild"

[functions."match-products-ai"]
  timeout = 120

[functions."ai-parse"]
  timeout = 120

# LLM plugin (MCP server) — run_report can hit cold Neon connections
[functions."mcp"]
  timeout = 60

# Scheduled: supplier outreach cadence reminders (daily 14:00 UTC / 09:00 CT)
[functions."cron-supplier-reminders"]
  schedule = "0 14 * * *"

# Standalone mobile picker (no auth) — must precede the SPA catch-all
[[redirects]]
  from = "/manifest"
  to = "/manifest.html"
  status = 200

# Legal pages (static HTML in public/) — required URLs for AI assistant directory listings
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# LLM plugin: stable MCP endpoint URL for external clients (ChatGPT, Claude, Cursor, etc.)
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# OAuth discovery for the MCP server (RFC 9728). Hosts probe both the bare path
# and the path-suffixed variant for a resource at /mcp.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200
  force = true

# Plugin docs link advertised in the discovery document
[[redirects]]
  from = "/docs/llm-plugin"
  to = "https://github.com/will-cann/trim-tracker/blob/main/docs/llm-plugin.md"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
