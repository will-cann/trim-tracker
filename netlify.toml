[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  # lambda-local default is 30s — bump for AI functions
  timeout = 120

[functions]
  node_bundler = "esbuild"

[functions."match-products-ai"]
  timeout = 120

[functions."ai-parse"]
  timeout = 120

# LLM plugin (MCP server) — run_report can hit cold Neon connections
[functions."mcp"]
  timeout = 60

# Manifest picker ↔ Metrc via T3: each call fans out to several Metrc page loads
[functions."t3-verify-packages"]
  timeout = 60

[functions."t3-create-transfer"]
  timeout = 60

# Scheduled: supplier outreach cadence reminders (daily 14:00 UTC / 09:00 CT)
[functions."cron-supplier-reminders"]
  schedule = "0 14 * * *"

# Metrc → NeuroCann sync via T3 (docs/metrc-sync.md). The cron only queues a run and
# hands it to metrc-sync-background (a Netlify background function, 15-minute limit),
# which does the pulling. No-op on deploys without T3_API_KEY + one allowlisted company.
[functions."cron-metrc-sync"]
  schedule = "*/15 * * * *"

# Standalone mobile picker (Auth0 sign-in, returns to /manifest) — must precede the SPA catch-all
[[redirects]]
  from = "/manifest"
  to = "/manifest.html"
  status = 200

# Growth server (growth/ in this repo, deployed on Railway). Same-origin proxy so the
# public "Book a Demo" form posts without CORS; Netlify forwards the visitor IP in
# X-Forwarded-For. Only the public demo-request route is exposed; /mcp stays on the
# growth host itself.
[[redirects]]
  from = "/api/growth/v1/demo-requests"
  to = "https://growth.neurocann.app/v1/demo-requests"
  status = 200
  force = true

# LLM plugin: stable MCP endpoint URL for external clients (ChatGPT, Claude, Cursor, etc.)
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# OAuth discovery for the MCP server (RFC 9728). Hosts probe both the bare path
# and the path-suffixed variant for a resource at /mcp.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200
  force = true

# Plugin docs link advertised in the discovery document
[[redirects]]
  from = "/docs/llm-plugin"
  to = "https://github.com/will-cann/trim-tracker/blob/main/docs/llm-plugin.md"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
