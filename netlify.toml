[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  # lambda-local default is 30s — bump for AI functions
  timeout = 120

[functions]
  node_bundler = "esbuild"

[functions."match-products-ai"]
  timeout = 120

[functions."ai-parse"]
  timeout = 120

# Scheduled: supplier outreach cadence reminders (daily 14:00 UTC / 09:00 CT)
[functions."cron-supplier-reminders"]
  schedule = "0 14 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
