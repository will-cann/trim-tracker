[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  # lambda-local default is 30s — bump for AI functions
  timeout = 120

[functions]
  node_bundler = "esbuild"

[functions."match-products-ai"]
  timeout = 120

[functions."ai-parse"]
  timeout = 120

# LLM plugin (MCP server) — run_report can hit cold Neon connections
[functions."mcp"]
  timeout = 60

# Scheduled: supplier outreach cadence reminders (daily 14:00 UTC / 09:00 CT)
[functions."cron-supplier-reminders"]
  schedule = "0 14 * * *"

# Standalone mobile picker (no auth) — must precede the SPA catch-all
[[redirects]]
  from = "/manifest"
  to = "/manifest.html"
  status = 200

# LLM plugin: stable MCP endpoint URL for external clients (Claude, Cursor, etc.)
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
